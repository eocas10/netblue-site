name: Actualizar blog

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días, 7:17 a. m. en Puerto Rico
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar sharp (miniaturas de las imágenes)
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp
      - name: Generar páginas del blog desde Soro
        run: node scripts/build-blog.mjs
      - name: Publicar si hay cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "netblue-blog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Actualizar artículos del blog"
            # Otra tarea (p. ej. PageSpeed) puede haber publicado en main mientras tanto:
            # traer esos cambios y reintentar en vez de fallar.
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -q origin main && git push; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "No se pudo publicar tras 5 intentos"; exit 1; }
          else
            echo "Sin artículos nuevos"
          fi
