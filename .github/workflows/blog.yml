name: Actualizar blog

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días, 7:17 a. m. en Puerto Rico
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar páginas del blog desde Soro
        run: node scripts/build-blog.mjs
      - name: Publicar si hay cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "netblue-blog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Actualizar artículos del blog"
            git push
          else
            echo "Sin artículos nuevos"
          fi
